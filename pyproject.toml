[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-coprocessors"
version = "0.1.0"
description = "Evidence-gated experiments for cognitive coprocessors"
readme = "README2.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.46,<5"]
analysis = ["matplotlib>=3.7", "scikit-learn>=1.5,<2"]
public-benchmarks = ["pyarrow>=18,<24"]
lora = ["peft==0.20.0", "accelerate==1.14.0"]
data = ["duckdb>=1.2,<2", "faiss-cpu>=1.10,<2", "numpy>=1.25"]
data-services = [
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "qdrant-client>=1.15,<2",
]
data-governance = [
  "pyiceberg[sql-sqlite,pyarrow]>=0.10,<1",
  "pyoxigraph>=0.5,<1",
]
test = ["pytest>=8.0"]

[project.scripts]
ccpu = "ccpu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires explicitly configured external services",
]

[tool.ruff]
line-length = 100
target-version = "py310"
